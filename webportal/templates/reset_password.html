<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartAttend - Reset Password</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="login-wrap">
        <div class="login-brand">
            <div class="brand-logo">SA</div>
            <h1>SmartAttend</h1>
            <p>Set a new password</p>
        </div>
        <div class="panel login-card">
            {% if success %}
            <p>Your password has been reset. You can now log in.</p>
            <a href="/login" class="btn-block" style="display:block; text-align:center; text-decoration:none;">Go to Login</a>
            {% else %}
            {% if error %}<div class="error">{{ error }}</div>{% endif %}
            <form method="post" action="/reset-password">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <input type="hidden" name="token" value="{{ token }}">
                <label for="new_password">New Password</label>
                <input type="password" id="new_password" name="new_password" required autofocus>
                <label for="confirm_password">Confirm New Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required>
                <button type="submit" class="btn-block">Reset Password</button>
            </form>
            {% endif %}
        </div>
    </div>
</body>
</html>
