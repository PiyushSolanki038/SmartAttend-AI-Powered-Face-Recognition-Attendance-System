<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartAttend - Forgot Password</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="login-wrap">
        <div class="login-brand">
            <div class="brand-logo">SA</div>
            <h1>SmartAttend</h1>
            <p>Reset your password</p>
        </div>
        <div class="panel login-card">
            {% if sent %}
            <p>If an account with an email on file matches what you entered, a reset link has been sent. Check your inbox.</p>
            <a href="/login" class="btn-block" style="display:block; text-align:center; text-decoration:none;">Back to Login</a>
            {% else %}
            <form method="post" action="/forgot-password">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <label for="username_or_email">Roll Number or Email</label>
                <input type="text" id="username_or_email" name="username_or_email" required autofocus>
                <button type="submit" class="btn-block">Send Reset Link</button>
            </form>
            <p style="margin-top:14px;"><a href="/login">&#8592; Back to Login</a></p>
            {% endif %}
        </div>
    </div>
</body>
</html>
