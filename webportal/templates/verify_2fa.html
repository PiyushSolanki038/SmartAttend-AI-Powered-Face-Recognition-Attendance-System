<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartAttend - Verify Code</title>
    <script>try{var t=localStorage.getItem("sa-theme");if(t==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}</script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="login-wrap">
        <div class="login-brand">
            <div class="brand-logo">SA</div>
            <h1>Two-Factor Login</h1>
            <p>Enter the 6-digit code from your authenticator app</p>
        </div>
        <div class="panel login-card">
            {% if error %}<div class="error">{{ error }}</div>{% endif %}
            <form method="post" action="/verify-2fa">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <label for="code">Authentication Code</label>
                <input type="text" id="code" name="code" inputmode="numeric" pattern="[0-9]*" maxlength="6"
                       autocomplete="one-time-code" required autofocus>
                <button type="submit" class="btn-block">Verify</button>
            </form>
            <p style="margin-top:14px;"><a href="/login">&#8592; Back to login</a></p>
        </div>
    </div>
<script src="/static/app.js" defer></script>
</body>
</html>
